@if(modules$ | async) {
  <div class="role-module-table-wrapper">
    <table class="role-module-table">
      <thead>
        <tr>
          @for (array of modules(); track array.Role) {
          <th>
            <div class="flex-center">
              <i class="fas fa-user-shield success"></i>
              <div class="text-bold">{{ array.Role }}</div>
            </div>
          </th>
          }
        </tr>
      </thead>
      <tbody>
        <tr>
          @for (modules of modules(); track modules.Role) {
          <td>
            <div>
              @for (module of modules.Modulos; track module.Id) {
              <qx-module-card [module]="module" [status]="true" />
              }
            </div>
          </td>
          }
        </tr>
      </tbody>
    </table>
</div>
}
