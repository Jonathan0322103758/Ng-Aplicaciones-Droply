@if(activity$ | async) {
    <div class="content-page">
        <qx-title-header title="Espacio Personal" />
        <div class="single-content flex-row">
            @for (column of activity(); let i = $index; track i) {
            <div class="kanban-column flex-column" cdkDropList [id]="'column-drop-' + i" [cdkDropListData]="column.Actividades"
                [cdkDropListConnectedTo]="dropListIds()" (cdkDropListDropped)="drop($event, column)">
                <div class="title flex-column">
                    <label class="text-bold" [class]="getStatusColor(column.Estado)">{{ column.Estado }}</label>
                    <div class="bar" [class]="getStatusColor(column.Estado)"></div>
                </div>
                <div class="flex-end">
                    <qx-button type="icon" styleClass="square primary-ghost" icon="fas fa-plus"
                        (onClick)="toggleForm(column._id)" />
                </div>
    
                @if (formOpen[column._id]) {
                <div class="add-task-card flex-column">
                    <qx-input type="text" styleClass="square" label="Titulo" [required]="true" [(value)]="formPost.Titulo"/>
                    <qx-input type="text" styleClass="square" label="Resumen" [required]="true" [(value)]="formPost.Descripcion"/>
                    <div class="date flex-end">
                        <qx-select-date label="Vencimiento" [dateInput]="formPost.FechaFin"/>
                        <qx-button type="label" styleClass="square danger-ghost" label="Cancelar" (onClick)="cancelForm()"/>
                        <qx-button type="label" styleClass="square success-ghost" label="Guardar" (onClick)="guardarActividad(column.Estado)"/>
                    </div>
                </div>
                }
                @for (task of column.Actividades; track task) {
                <div cdkDrag class="task-wrapper">
                    <div class="task-placeholder" *cdkDragPlaceholder></div>
    
                    <qx-activity-card [title]="task.Titulo" [fromTo]="getFromTo(task.FechaInicio, task.FechaFin)"
                        [summary]="task.Descripcion" />
                </div>
                }
            </div>
            }
        </div>
    </div>
}
