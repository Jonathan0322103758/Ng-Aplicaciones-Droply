<div class="content-page">
  <qx-title-header title="Notificaciones" />

  <!-- BOTONES GRANDES ARRIBA -->
  <div class="container option flex-end">
    <qx-button type="label-icon" styleClass="rounded primary" icon="fas fa-envelope-open-text" label="Últimos mensajes" (onClick)="openLatestMessages()" />
    <qx-button type="label-icon" styleClass="rounded success" icon="fas fa-paper-plane" label="Enviar mensaje" (onClick)="sendMessage()" />
    <qx-button type="label-icon" styleClass="rounded warning" icon="fas fa-clock" label="Recordar más tarde" (onClick)="remindLater()" />
    <qx-button type="label-icon" styleClass="rounded secondary" icon="fas fa-archive" label="Archivados" (onClick)="openArchived()" />
    <qx-button type="label-icon" styleClass="rounded danger" icon="fas fa-trash" label="Papelera" (onClick)="openTrash()" />
  </div>

  <!-- DOS COLUMNAS -->
  <div class="bottom-section">
    <!-- IZQUIERDA: LISTA -->
    <div class="messages-list">
      <qx-title-header title="Últimos mensajes" />
      <div class="message-item" *ngFor="let msg of messages">
        <div class="info">
          <h4>{{ msg.title }}</h4>
          <p>{{ msg.concept }}</p>
        </div>
        <div class="actions">
          <qx-button type="icon" styleClass="rounded primary" icon="fas fa-eye" (onClick)="view(msg)" />
          <qx-button type="icon" styleClass="rounded warning" icon="fas fa-clock" (onClick)="snooze(msg)" />
          <qx-button type="icon" styleClass="rounded secondary" icon="fas fa-archive" (onClick)="archive(msg)" />
          <qx-button type="icon" styleClass="rounded danger" icon="fas fa-trash" (onClick)="delete(msg)" />
        </div>
      </div>
    </div>

    <!-- DERECHA: SIEMPRE VISIBLE -->
    <div class="message-preview">
      <div class="header">
        <qx-title-header [title]="selectedMessage?.title || 'Nombre Nuevo Mensaje'" />
        <div class="datetime">
          {{ selectedMessage?.date | date: 'dd/MM/yyyy' }}<br />
          {{ selectedMessage?.date | date: 'hh:mm a' }}
        </div>
        <qx-button type="icon" styleClass="rounded" icon="fas fa-xmark" (onClick)="closePreview()" />
      </div>
      <div class="body">
        <strong>Concepto:</strong>
        <p>{{ selectedMessage?.content || 'Selecciona un mensaje para ver su contenido.' }}</p>
      </div>
    </div>
  </div>
</div>
