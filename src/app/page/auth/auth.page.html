<div class="auth-container flex-row">
    <div class="form flex-column">
        <img src="../../../assets/images/cubo.png">
        <div class="form-body flex-column">
            <h1 class="text-bold">Iniciar sesión</h1>
            <qx-input
                type="text"
                styleClass="square"
                label="Matricula"
                placeholder="Ingresa tu usuario"
                [required]="true"
                [(value)]="username"
            />
            <qx-input
                type="password"
                styleClass="square"
                label="Contraseña"
                placeholder="Ingresa tu contraseña"
                [required]="true"
                [(value)]="password"
            />
            <div class="flex-end">
                <qx-button
                    type="label"
                    label="Iniciar sesión"
                    styleClass="square primary-ghost"
                    (onClick)="login()"
                />
            </div>
        </div>
    </div>
    <div class="cube-blue flex-center flex-column">
        <div class="title">
            <h1>QubeFlex</h1>
            <h4 class="subtitle">Droply</h4>
        </div>
    </div>
</div>
